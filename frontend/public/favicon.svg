<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- OmniNovel Studio Logo -->
  <defs>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C13828"/>
      <stop offset="100%" stop-color="#8B2A1F"/>
    </linearGradient>
  </defs>
  <!-- Open book -->
  <path d="M32 14 C22 12, 10 14, 8 18 L8 50 C10 47, 22 45, 32 48 C42 45, 54 47, 56 50 L56 18 C54 14, 42 12, 32 14Z" 
        fill="none" stroke="url(#inkGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Center spine -->
  <line x1="32" y1="14" x2="32" y2="48" stroke="url(#inkGrad)" stroke-width="2"/>
  <!-- Page lines left -->
  <line x1="14" y1="24" x2="28" y2="22" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="14" y1="30" x2="28" y2="28" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="14" y1="36" x2="28" y2="34" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="14" y1="42" x2="28" y2="40" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <!-- Page lines right -->
  <line x1="36" y1="22" x2="50" y2="24" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="36" y1="28" x2="50" y2="30" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="36" y1="34" x2="50" y2="36" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <line x1="36" y1="40" x2="50" y2="42" stroke="#C13828" stroke-width="1.2" opacity="0.4"/>
  <!-- Quill pen -->
  <path d="M48 8 C46 12, 44 18, 42 22 C43 20, 45 16, 48 8Z" 
        fill="url(#inkGrad)" opacity="0.8"/>
  <line x1="42" y1="22" x2="40" y2="26" stroke="#C13828" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ink drop -->
  <circle cx="40" cy="28" r="2" fill="#C13828" opacity="0.6"/>
</svg>